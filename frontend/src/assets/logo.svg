<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
  </defs>
  <!-- "i" dot -->
  <circle cx="14" cy="10" r="3.5" fill="url(#g)"/>
  <!-- Shared horizontal bar of T (and top of i stroke) -->
  <rect x="8" y="18" width="32" height="5" rx="2.5" fill="url(#g)"/>
  <!-- "i" vertical stroke -->
  <rect x="11" y="23" width="6" height="17" rx="3" fill="url(#g)"/>
  <!-- "T" vertical stroke -->
  <rect x="21" y="23" width="6" height="17" rx="3" fill="url(#g)"/>
</svg>
